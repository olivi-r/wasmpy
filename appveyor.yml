environment:
  PYPI_TOKEN:
    secure: Ej5+0zxoEbzldGFB9gEbEOI81xpoxi+qk2FG5O2JKnw+9seQfRf9iudWM/98pLE2/vi/KkvrGOidtbz3cS3w/ZmtfZiQf/Tp5sG8YlL21oDdRMMW/EZIc049XvAOTsnb2fAziS19I/UNPFpu/Dzo1Xo/KNax5WuX66zWZFJ2P0oFw0Wv36D9aHpfm4IYEHGewVGZMpvXk993HOOZdeZt0uG02zU85EG08EGP092zDp6SL3WsyVZ7YtJn3Lk3W+7c6BKoKG8sKYn61MLi9J9kEQ==

  matrix:
    - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu
      BUILD_TYPE: sdist
    - APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2015
      BUILD_TYPE: wheel
    - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu
      BUILD_TYPE: wheel

stack: python 3.7

install:
  - appveyor DownloadFile https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/nasm-2.16.03.tar.xz
  - 7z x nasm-2.16.03.tar.xz
  - cd nasm-2.16.03
  - ./configure --prefix=/usr
  - make
  - sudo make install
  - cd ..
  - python -m pip install build cibuildwheel

for:
  - matrix:
      only:
        - APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2015
          BUILD_TYPE: wheel

    install:
      - appveyor DownloadFile https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip
      - 7z x nasm-2.16.03-win64.zip
      - set PATH=%PATH%;%CD%\nasm-2.16.03
      - py -3 -m pip install build cibuildwheel

    build_script:
      - cmake -S. -Bbuild
      - cmake --build build --target x86 x86-64
      - py -3 -m cibuildwheel --output-dir dist

  - matrix:
      only:
        - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu
          BUILD_TYPE: sdist

    build_script:
      - cmake -S. -Bbuild
      - cmake --build build --target x86 x86-64
      - python -m build --sdist

  - matrix:
      only:
        - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu
          BUILD_TYPE: wheel

    build_script:
      - cmake -S. -Bbuild
      - cmake --build build --target x86 x86-64
      - python -m cibuildwheel --output-dir dist

artifacts:
  - path: "dist\\*"

deploy:
  description: ""
  provider: GitHub
  auth_token:
    secure: atWS2pKyihyRyTzMopS3FzlG+VT/r3fx5pk+7E2BwvyxdAGiSmH/pDXPBIPArdW0
  artifact: /.*\.(whl|tar\.gz)/
  draft: true
  on:
    branch: main
    APPVEYOR_REPO_TAG: true

after_deploy:
  - ps: |
      if ($env:APPVEYOR_REPO_TAG -eq "true") {
        python -m pip install twine
        python -m twine upload -u __token__ -p ${env:PYPI_TOKEN} --skip-existing dist/*
      }
